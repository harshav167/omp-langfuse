name: CI

on:
  pull_request:
  push:
    branches: [main]
  # omp releases often, so a failure can appear without pull request activity.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

# Pushes and scheduled runs fall back to the run id, so they never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

env:
  BUN_VERSION: 1.4.4

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck

  test:
    # The suite starts the real omp command-line interface from the
    # devDependency, so the installed build is the one under test.
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Report the omp build under test
        run: ./node_modules/.bin/omp --version
      - name: Test
        run: bun test --timeout 60000 test/*.test.ts
        env:
          PI_SKIP_VERSION_CHECK: "1"
          PI_TELEMETRY: "0"

  package:
    # omp installs extensions with npm, whose `--legacy-peer-deps` skips peer
    # dependencies. Every other job installs with Bun, which does install them,
    # so no other job can see a dependency that the published package fails to
    # carry.
    name: Install the packed tarball the way omp does
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Pack the tarball
        run: |
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP" --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename")"
          echo "TARBALL=$RUNNER_TEMP/$tarball" >> "$GITHUB_ENV"
      - name: Install the tarball with omp's flags
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --legacy-peer-deps "$TARBALL"
      - name: Load the tracing entry point
        working-directory: ${{ runner.temp }}/consumer
        run: node --input-type=module -e "await import('@langfuse/otel'); console.log('The tracing entry point loaded.')"
      - name: Check that every required peer dependency is present
        working-directory: ${{ runner.temp }}/consumer
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const allowed = new Set(["@oh-my-pi/pi-coding-agent"]);
            const root = path.join(process.cwd(), "node_modules");
            const installed = new Map();
            const scan = (dir, scope) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                if (!entry.isDirectory()) continue;
                if (entry.name.startsWith("@")) {
                  scan(path.join(dir, entry.name), entry.name);
                  continue;
                }
                const name = scope ? scope + "/" + entry.name : entry.name;
                try {
                  const manifest = path.join(dir, entry.name, "package.json");
                  installed.set(name, JSON.parse(fs.readFileSync(manifest, "utf8")));
                } catch {}
              }
            };
            scan(root, null);
            const missing = [];
            for (const [name, manifest] of installed) {
              const meta = manifest.peerDependenciesMeta || {};
              for (const [peer, range] of Object.entries(manifest.peerDependencies || {})) {
                if (installed.has(peer)) continue;
                if (allowed.has(peer)) continue;
                if (meta[peer] && meta[peer].optional) continue;
                missing.push(peer + " " + range + " required by " + name);
              }
            }
            if (missing.length > 0) {
              console.error("The published package does not carry these peer dependencies:");
              for (const line of missing) console.error("  " + line);
              console.error("Add each one to dependencies in package.json.");
              process.exit(1);
            }
            console.log("All " + installed.size + " installed packages have their peer dependencies.");
          '
